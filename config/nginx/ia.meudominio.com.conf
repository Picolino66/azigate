server {
    listen 80;
    listen [::]:80;
    server_name ia.meudominio.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ia.meudominio.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ia.meudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ia.meudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;
    add_header X-Accel-Buffering "no" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/(?:health|ready|v1/models|v1/chat/completions)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        gzip off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 610s;
        send_timeout 600s;

        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_ignore_client_abort off;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie "";
        proxy_set_header Forwarded "";
    }

    # Agent Plane (azigate-agentd no host, ADR-022). REST e SSE de eventos.
    location ~ ^/agent/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        gzip off;
        client_max_body_size 1m;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3610s;

        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie "";
        proxy_set_header Forwarded "";
    }

    # WebSocket: eventos nativos (somente saída) e conexão de saída dos workers.
    location ~ ^/(?:native/(?:codex|claude|agy)/[A-Za-z0-9_]+|worker/v1/connect)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie "";
        proxy_set_header Forwarded "";
    }

    location / {
        return 404;
    }
}
