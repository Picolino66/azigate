openapi: 3.1.0
info:
  title: DeepSeek Gateway
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        '200': { description: Processo saudável }
  /ready:
    get:
      responses:
        '200': { description: Processo pronto }
        '503': { description: Processo não pronto }
  /v1/models:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de modelos compatível com OpenAI }
  /v1/chat/completions:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, minLength: 1 }
                messages: { type: array, items: {} }
                stream: { type: boolean }
              additionalProperties: true
      responses:
        '200': { description: Chat Completion JSON ou SSE }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

