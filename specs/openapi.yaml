openapi: 3.1.0
info:
  title: AziGate
  version: 3.0.0
  description: Gateway OpenAI Compatible para um upstream OpenAI-compatible (DeepSeek por padrão) e aliases Codex/Claude traduzidos para a Responses API e a Messages API nativas.
paths:
  /health:
    get:
      responses:
        '200':
          description: Processo saudável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      responses:
        '200':
          description: Ao menos um provider utilizável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: Nenhum provider pronto
  /v1/models:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Catálogo combinado compatível com OpenAI
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object]
                      properties:
                        id: { type: string }
                        object: { const: model }
                      additionalProperties: true
                additionalProperties: true
        '503':
          description: Nenhum provider utilizável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/chat/completions:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, minLength: 1 }
                messages: { type: array, items: {} }
                stream: { type: boolean }
                tools: { type: array, items: {} }
                tool_choice: {}
                parallel_tool_calls: { type: boolean }
                reasoning_effort:
                  description: Para aliases Codex/Claude, formato plano legado com enum low, medium, high, xhigh ou max e precedência sobre reasoning.effort. Para o upstream, permanece opaco.
                reasoning:
                  description: Para aliases Codex/Claude, false usa o default e reasoning.effort aceita low, medium, high, xhigh ou max. Para o upstream, permanece opaco.
                  example: { effort: medium }
              additionalProperties: true
      responses:
        '200':
          description: Chat Completion JSON ou SSE
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Requisição ou reasoning effort inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Corpo HTTP acima do limite configurado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit local excedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Falha de conexão, protocolo ou erro retornado pelo provedor (upstream, Codex ou Claude)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Provider Codex/Claude indisponível (desabilitado ou sem login OAuth)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: Timeout do provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { const: ok }
        service: { const: azigate }
    Ready:
      type: object
      required: [status, service]
      properties:
        status: { const: ready }
        service: { const: azigate }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { const: gateway_error }
            code: { type: string }
